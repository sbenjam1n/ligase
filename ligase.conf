# Ligase~ Configuration File
# This file controls the grain pool size for the ligase~ external
#
# Location: Place this file in the same directory as ligase~.pd_linux
# Changes take effect after restarting Pure Data
#
# Default: 200 grains (uses ~40KB memory)
# Range: 1-2000 grains
#
# Memory usage estimate:
#   200 grains  = ~40KB  (default, suitable for most patches)
#   500 grains  = ~100KB (high-density granular textures)
#   1000 grains = ~200KB (complex multi-layered patches)
#   2000 grains = ~400KB (extreme polyphony, highest density)
#
# Usage recommendations:
#   50-100   : Simple patches, low grain density
#   200-300  : Standard patches, moderate density (default range)
#   500-1000 : Complex patches, high density
#   1000-2000: Extreme patches, maximum polyphony
#
# If this file is not found or invalid, ligase~ will default to 200 grains

max_grains = 200
