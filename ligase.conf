# Ligase~ Configuration File
# This file controls the grain pool size for the ligase~ external
#
# Location: Place this file in the same directory as ligase~.pd_linux
# Changes take effect after restarting Pure Data
#
# Default: 200 grains (uses ~40KB memory)
# Range: 1-2000 grains
#
# Memory usage estimate:
#   200 grains  = ~40KB  (default, suitable for most patches)
#   500 grains  = ~100KB (high-density granular textures)
#   1000 grains = ~200KB (complex multi-layered patches)
#   2000 grains = ~400KB (extreme polyphony, highest density)
#
# Usage recommendations:
#   50-100   : Simple patches, low grain density
#   200-300  : Standard patches, moderate density (default range)
#   500-1000 : Complex patches, high density
#   1000-2000: Extreme patches, maximum polyphony
#
# If this file is not found or invalid, ligase~ will default to 200 grains

max_grains = 200

# Fog effect FFT configuration
# Changes take effect after restarting Pure Data
#
# fft_size: 512, 1024 (default), or 2048
#   512  = lower latency (~10ms at 4x overlap), less frequency resolution
#   1024 = standard (~21ms at 4x overlap), balanced resolution and latency
#   2048 = highest frequency resolution, ~42ms latency at 4x overlap
#
# overlap_factor: 2, 4 (default), or 8
#   2 = 50% overlap, lightest CPU, audible OLA artifacts at low settings
#   4 = 75% overlap, standard — smooth COLA with periodic Hann window
#   8 = 87.5% overlap, smoothest temporal evolution, 2x CPU vs 4x
#
# Memory cost (stereo): ~(fft_size * overlap_factor * 4 bytes * 12 buffers)
#   1024 fft / 4x overlap ≈ 200KB

fft_size = 1024
overlap_factor = 4

# Per-grain fog pool configuration
# Number of independent fog instances for per-grain mode (1-8, default 4)
# Each grain is assigned to a slot via round-robin at trigger time.
# Memory cost: ~76KB per slot (4 slots = ~304KB additional)
#
# To enable per-grain mode, send the message: fog_position 0
# Default mode is post-mix (fog_position 1) which uses a single fog instance.
fog_pool_size = 4
